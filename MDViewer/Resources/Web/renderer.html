<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 文書に紛れた script の実行と、外への送信を止める。インライン style は
         shiki・KaTeX・Mermaid が使う。外部の画像と動画は従来どおり表示する。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' mdviewer-local: data: blob: http: https:; media-src 'self' mdviewer-local: http: https:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
    <title>MDViewer</title>

    <!-- Vendor: KaTeX -->
    <link rel="stylesheet" href="vendor/katex.min.css">
    <!-- Base styles -->
    <link rel="stylesheet" href="mdviewer-base.css">
    <!-- Theme (swapped at runtime) -->
    <link rel="stylesheet" href="themes/github-light.css" id="theme-css">

    <script src="vendor/marked.min.js"></script>
    <script src="vendor/shiki.bundle.js"></script>
    <script src="vendor/katex.min.js"></script>
    <script src="vendor/mermaid.min.js"></script>
    <script src="vendor/gemoji.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="mdviewer.js"></script>
</head>
<body>
    <div id="content"></div>
</body>
</html>
